{% extends "base.html" %}
{% block title %}Inicio de sesión · HelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Iniciar sesión</h1>
<form method="post">
  <div class="mb-3"><label class="form-label" for="email">Correo electrónico</label><input class="form-control" id="email" name="email" type="email" maxlength="160" autocomplete="username" required></div>
  <div class="mb-3"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn-primary w-100">Ingresar</button>
</form></div></div></div></div>
{% endblock %}
